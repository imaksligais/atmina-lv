Šodien, izpildoties darījuma nosacījumiem, par izdevēja SIA "Mediju Nams" īpašnieci un patieso labuma guvēju ir kļuvusi Latvijas uzņēmēja Anastasija Udalova. SIA "Mediju Nams" ir mediju grupa, kas ietver portālus nra.lv, tautaruna.lv un lifehacks.lv, digitālo laikrakstu Neatkarīgā un žurnālu Vakara Ziņas. A. Udalova līdz šim ir investējusi uzņēmumā SIA H.A. Brieger un veiksmīgi atjaunojusi kosmētikas zīmolu Dzintars.
A. Udalova ir arī AS Daugavpils Lokomotīvju Remonta Rūpnīca padomes priekšsēdētāja, valdes locekle un investore vienā no lielākajiem saules enerģijas parku projektiem SIA SP Austrumi un padomes priekšsēdētāja vienā no lielākajiem nekustamā īpašuma projektiem Gruzijā Tbilisi Hills.
“Mūsu mērķis ir nostiprināt NRA.LV lomu Latvijas vadošo sociāli - ekonomisko, dienaskārtību veidojošo mediju lokā un primāri konkurēt ar DELFI un LSM.
