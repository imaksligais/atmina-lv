Par TVNET galveno redaktori ir kļuvusi līdzšinējā RUSTVNET galvenā redaktore un TVNET satura projektu vadītāja Ērika Staškeviča.
Turpmāk Ērika Staškeviča būs TVNET galvenā redaktore gan latviešu, gan krievu redakcijā, savukārt Kristīne Kravale turpina darbu kā Apollo galvenā redaktore. Darbu turpina arī Receptes.lv vadītāja Madara Stankeviča un “Spoku” vadītāja Evita Rauze. Tāpat līdzšinējais TVNET GRUPAS galvenais redaktors Toms Ostrovskis turpina darbu esošajā amatā.
TVNET GRUPAS galvenais redaktors Toms Ostrovskis: “Ērika Staškeviča ir ilggadēja kolēģe, kura sevi lieliski pierādījusi gan kā žurnāliste, gan kā RUSTVNET galvenā redaktore, saņemot Latvijas Žurnālistu asociācijas (LŽA) “Gada redaktora balvu” 2024. gadā. Ērikas darba ētika, dziļā izpratne par mediju nozari un tiekšanās uz žurnālistikas augstākajiem standartiem vēl vairāk nostiprinās TVNET GRUPAS reputāciju kā uzticamai med
